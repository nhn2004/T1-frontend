server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real cae en index.html,
    # igual que hace public/web.config con IIS para que refrescar en /Sesiones o
    # /Configuracion no dé 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
