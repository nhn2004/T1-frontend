server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real cae en index.html,
    # igual que hace public/web.config con IIS para que refrescar en /Sesiones o
    # /Configuracion no dé 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reenvía la API al contenedor `backend` por la red interna de Docker (nombre de
    # servicio, no localhost) — así el backend deja de necesitar su propio puerto
    # publicado a internet (antes 5054, directo, sin proxy). Un solo punto de entrada
    # público para todo el stack, igual que tendría cualquier despliegue con dominio.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
