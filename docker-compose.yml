# Stack de emergencia para presentar en el servidor Hetzner (Linux).
# NO es el despliegue definitivo — ese sigue siendo la máquina Windows + IIS de
# DEPLOY.md. Este compose junta: SQL Server, la API (.NET) y el frontend web (nginx).
#
# Uso (ver DEPLOY-DOCKER.md para el paso a paso completo):
#   cp .env.docker.example .env.docker
#   # editar .env.docker: SERVER_IP, MSSQL_SA_PASSWORD, JWT_SECRET_KEY
#   docker compose --env-file .env.docker up -d --build db backend frontend
#   docker compose --env-file .env.docker --profile tools run --rm migrate

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    ports:
      # Solo loopback del propio servidor — NUNCA 0.0.0.0 aquí, es una base de datos
      # médica. Para conectarse desde afuera (ej. DBeaver) se usa un túnel SSH que
      # reenvía este puerto, no exposición directa a internet.
      - "127.0.0.1:1433:1433"
    healthcheck:
      # No depende de la ruta exacta de sqlcmd/mssql-tools (cambió entre versiones de
      # la imagen) — solo confirma que el puerto de SQL Server ya acepta conexiones.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ../ProyectBomberos_Backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=bd_bomberos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: BomberosAPI
      JwtSettings__Audience: BomberosClient
      JwtSettings__ExpirationMinutes: "60"
      # Sin dominio en esta ruta de emergencia: se permite el origin de la IP directa
      # en el puerto real donde queda publicado el frontend (8081, no 80 — ver
      # docker-compose.yml del servicio "frontend") y localhost para poder probar
      # desde el propio servidor. El navegador llama a la API por el mismo origin
      # (nginx la reenvía en /api/, ver nginx.conf), así que esto en la práctica ya
      # casi no aplica al tráfico del frontend web — sigue haciendo falta para el
      # APK de tablets, que no está sujeto a CORS pero sí valida el origin en
      # algunas librerías HTTP, y como red de seguridad si algo llama directo.
      Cors__AllowedOrigins__0: "http://${SERVER_IP}:8081"
      Cors__AllowedOrigins__1: "http://localhost:8081"
      # Correo real (invitaciones, activación de cuenta, reseteo de contraseña) vía
      # SMTP con una cuenta de Gmail normal — a diferencia de un servicio de correo
      # transaccional (Resend, SendGrid), no exige verificar un dominio propio: al ser
      # tu propia cuenta autenticada, puede mandarle a cualquier destinatario sin
      # restricción de sandbox. GMAIL_APP_PASSWORD es una "contraseña de aplicación"
      # (no la contraseña normal) — se genera en https://myaccount.google.com/apppasswords
      # (requiere verificación en dos pasos activada en la cuenta).
      Smtp__Host: smtp.gmail.com
      Smtp__Port: "587"
      Smtp__Username: ${GMAIL_USER}
      Smtp__Password: ${GMAIL_APP_PASSWORD}
      Smtp__FromEmail: ${GMAIL_USER}
      Smtp__FromName: "FireHealth App"
      # Base de los enlaces que van en esos correos (completar registro, activar
      # cuenta, restablecer contraseña) — debe ser donde quede publicado el frontend.
      App__WebBaseUrl: "http://${SERVER_IP}:8081"
    ports:
      # Solo loopback: ya no se publica directo a internet (antes "5054:8080",
      # 0.0.0.0). El frontend (nginx) lo reenvía por la red interna de Docker en
      # /api/ — ver nginx.conf. Este binding queda solo para poder probar/depurar
      # desde el propio servidor con curl a localhost:5054.
      - "127.0.0.1:5054:8080"
    restart: unless-stopped

  # Aplica las migraciones de EF Core contra el contenedor `db`. No corre con
  # `docker compose up` — se invoca a mano una sola vez (o cuando haya migraciones
  # nuevas): docker compose --env-file .env.docker run --rm migrate
  migrate:
    build:
      context: ../ProyectBomberos_Backend
      dockerfile: Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=bd_bomberos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      # `dotnet ef` levanta el host completo (Program.cs) para resolver el DbContext,
      # y AddJwtAuthentication exige esta variable para arrancar — sin ella falla antes
      # de siquiera intentar tocar la base de datos.
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: BomberosAPI
      JwtSettings__Audience: BomberosClient
      JwtSettings__ExpirationMinutes: "60"
    entrypoint: ["bash", "-c"]
    command:
      - >
        dotnet tool install --global dotnet-ef --version 10.* &&
        export PATH="$$PATH:/root/.dotnet/tools" &&
        dotnet ef database update
        --project src/BomberosAPI.Infrastructure
        --startup-project src/BomberosAPI.API
    profiles: ["tools"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Mismo origin que el frontend (8081), no el 5054 directo — nginx reenvía
        # /api/ al backend por la red interna de Docker (ver nginx.conf). El APK de
        # tablets también debe recompilarse apuntando a esta misma URL.
        EXPO_PUBLIC_API_URL: "http://${SERVER_IP}:8081/api"
    depends_on:
      - backend
    ports:
      # 80/8080/8000 ya están ocupados por otros servicios en este servidor
      # (nginx del otro sitio + otros contenedores) — se publica en 8081.
      - "8081:80"
    restart: unless-stopped

volumes:
  mssql_data:
